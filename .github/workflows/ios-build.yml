name: iOS build

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone simulator app
        run: >-
          xcodebuild -project ios/HermosilloTemperature.xcodeproj
          -scheme HermosilloTemperature
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Check weather alert rules
        run: |
          swiftc ios/HermosilloTemperature/Models.swift ios/HermosilloTemperature/AlertRules.swift ios/tests/AlertRulesTests.swift -o /tmp/weather-alert-tests
          /tmp/weather-alert-tests
